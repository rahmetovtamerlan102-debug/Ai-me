<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08080d">
<title>AI Assistant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#08080d;
  --panel:rgba(20,20,32,0.75);
  --border:rgba(120,80,255,0.18);
  --accent:#7c3aed;
  --accent2:#06b6d4;
  --accent3:#ec4899;
  --text:#e8e8f0;
  --muted:#7a7a90;
  --code-bg:#05050a;
}

html,body{
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:-50%;
  background:
    radial-gradient(circle at 20% 20%, rgba(124,58,237,0.22), transparent 45%),
    radial-gradient(circle at 80% 70%, rgba(6,182,212,0.18), transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(236,72,153,0.15), transparent 50%);
  animation:bgmove 22s ease-in-out infinite alternate;
  z-index:-1;
  filter:blur(40px);
}
@keyframes bgmove{
  0%{transform:translate(0,0) rotate(0deg)}
  50%{transform:translate(-3%,4%) rotate(4deg)}
  100%{transform:translate(3%,-3%) rotate(-3deg)}
}

header{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  background:rgba(12,12,20,0.7);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px}
.dot{
  width:10px;height:10px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 0 12px var(--accent),0 0 20px rgba(6,182,212,0.5);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.25);opacity:0.75}
}
.title{
  font-size:16px;font-weight:700;letter-spacing:0.4px;
  background:linear-gradient(90deg,#a78bfa,#22d3ee,#f472b6);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.status{font-size:11px;color:var(--muted);margin-left:8px}
#clearBtn{
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  color:var(--text);
  width:38px;height:38px;border-radius:12px;
  font-size:16px;cursor:pointer;
  transition:.2s;
}
#clearBtn:active{transform:scale(0.9);background:rgba(124,58,237,0.2)}

main{
  flex:1;overflow-y:auto;
  padding:20px 14px 140px;
  height:calc(100vh - 66px);
  scroll-behavior:smooth;
}
main::-webkit-scrollbar{width:4px}
main::-webkit-scrollbar-thumb{background:rgba(124,58,237,0.4);border-radius:4px}

.welcome{
  text-align:center;padding:50px 20px 30px;
  animation:fadeUp .6s ease;
}
.welcome h1{
  font-size:32px;font-weight:800;
  background:linear-gradient(135deg,#a78bfa,#22d3ee,#f472b6);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:12px;letter-spacing:-0.5px;
}
.welcome p{color:var(--muted);font-size:14px;line-height:1.6}
.chips{
  display:flex;flex-wrap:wrap;gap:8px;
  justify-content:center;margin-top:22px;
}
.chip{
  padding:9px 16px;border-radius:20px;
  background:rgba(124,58,237,0.1);
  border:1px solid var(--border);
  color:#c4b5fd;font-size:13px;
  cursor:pointer;transition:.2s;
}
.chip:active{transform:scale(0.95);background:rgba(124,58,237,0.25)}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}

.msg{
  max-width:94%;margin-bottom:16px;
  padding:13px 16px;border-radius:18px;
  line-height:1.55;font-size:15px;
  word-wrap:break-word;
  animation:fadeUp .35s ease;
}
.msg.user{
  background:linear-gradient(135deg,#7c3aed,#6366f1);
  color:#fff;margin-left:auto;
  border-bottom-right-radius:6px;
  box-shadow:0 6px 24px rgba(124,58,237,0.35);
  white-space:pre-wrap;
}
.msg.bot{
  background:var(--panel);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border);
  border-bottom-left-radius:6px;
  box-shadow:0 6px 24px rgba(0,0,0,0.4);
}

.section-title{
  font-size:12px;letter-spacing:1.5px;
  color:var(--muted);text-transform:uppercase;
  margin:14px 0 8px;
}

.quote{
  border-left:3px solid;
  border-image:linear-gradient(180deg,#7c3aed,#06b6d4) 1;
  padding:4px 0 4px 12px;
  margin:8px 0;
  color:#c8c8d8;font-size:14px;
  line-height:1.6;
}

/* Репозитории */
.repo{
  background:rgba(0,0,0,0.3);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin:8px 0;
}
.repo-head{
  display:flex;justify-content:space-between;
  align-items:flex-start;gap:8px;
  margin-bottom:6px;
}
.repo-name{
  font-weight:700;font-size:14px;
  color:#c4b5fd;word-break:break-all;
}
.repo-stars{
  font-size:12px;color:#fbbf24;
  white-space:nowrap;flex-shrink:0;
}
.repo-lang{
  font-size:11px;color:var(--muted);
  margin-bottom:6px;
}
.repo-desc{
  font-size:13px;color:#b8b8c8;
  line-height:1.5;margin-bottom:8px;
}
.repo-topics{
  font-size:11px;color:var(--accent2);
  margin-bottom:8px;
}
.repo-link{
  font-size:12px;color:var(--accent2);
  text-decoration:none;word-break:break-all;
}

/* Код */
.code-block{
  background:var(--code-bg);
  border:1px solid rgba(124,58,237,0.3);
  border-radius:10px;
  margin:8px 0;
  overflow:hidden;
  position:relative;
}
.code-block::before{
  content:"";
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,#7c3aed,#06b6d4);
}
.code-head{
  padding:8px 12px 8px 16px;
  font-size:11px;color:var(--muted);
  border-bottom:1px solid rgba(124,58,237,0.15);
  word-break:break-all;
}
.code-block pre{
  padding:12px 14px 12px 16px;
  overflow-x:auto;
  margin:0;
}
.code-block code{
  font-family:"SF Mono",Menlo,Consolas,monospace;
  font-size:12.5px;line-height:1.55;
  white-space:pre;color:#e2e2ee;
}

.typing{
  display:inline-flex;gap:5px;align-items:center;
  color:var(--muted);font-size:14px;
}
.typing span{
  width:6px;height:6px;border-radius:50%;
  background:var(--accent);display:inline-block;
  animation:bounce 1.2s infinite;
}
.typing span:nth-child(2){animation-delay:0.15s;background:var(--accent2)}
.typing span:nth-child(3){animation-delay:0.3s;background:var(--accent3)}
@keyframes bounce{
  0%,60%,100%{transform:translateY(0);opacity:0.5}
  30%{transform:translateY(-6px);opacity:1}
}

.cache-tag{
  display:inline-block;margin-top:6px;
  font-size:11px;color:var(--muted);
  padding:2px 8px;border-radius:6px;
  background:rgba(255,255,255,0.04);
}

form{
  position:fixed;bottom:0;left:0;right:0;
  padding:12px 14px 16px;
  background:linear-gradient(180deg,transparent,rgba(8,8,13,0.95) 30%);
  display:flex;gap:10px;align-items:flex-end;
  z-index:30;
}
.input-wrap{
  flex:1;position:relative;display:flex;align-items:flex-end;
  background:var(--panel);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:24px;
  padding:4px 4px 4px 18px;
  transition:.25s;
}
.input-wrap:focus-within{
  border-color:rgba(124,58,237,0.6);
  box-shadow:0 0 0 3px rgba(124,58,237,0.15),0 0 24px rgba(124,58,237,0.25);
}
#input{
  flex:1;background:transparent;border:none;
  color:var(--text);font-size:15px;
  font-family:inherit;
  padding:12px 0;resize:none;
  max-height:120px;outline:none;
  line-height:1.4;
}
#input::placeholder{color:var(--muted)}
#sendBtn{
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  border:none;color:#fff;
  width:42px;height:42px;border-radius:50%;
  font-size:16px;cursor:pointer;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:.2s;
  box-shadow:0 4px 14px rgba(124,58,237,0.45);
}
#sendBtn:active{transform:scale(0.9)}
#sendBtn:disabled{
  background:#2a2a3a;
  box-shadow:none;
  cursor:not-allowed;
  opacity:0.5;
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="dot"></div>
    <div class="title">AI ASSISTANT</div>
    <div class="status" id="status"></div>
  </div>
  <button id="clearBtn" title="Очистить">🗑</button>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <h1>Привет 👋</h1>
    <p>Ищу в интернете, GitHub и Wikipedia</p>
    <div class="chips">
      <div class="chip" data-q="Что такое докс">Что такое докс</div>
      <div class="chip" data-q="библиотека для парсинга Python">Парсинг Python</div>
      <div class="chip" data-q="репозиторий для телеграм бота">Telegram бот</div>
      <div class="chip" data-q="Что такое рекурсия">Что такое рекурсия</div>
    </div>
  </div>
</main>

<form id="form">
  <div class="input-wrap">
    <textarea id="input" placeholder="Спроси что-нибудь..." rows="1"></textarea>
    <button type="submit" id="sendBtn">➤</button>
  </div>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const clearBtn = document.getElementById("clearBtn");
const welcome = document.getElementById("welcome");
const statusEl = document.getElementById("status");

fetch("/api/status").then(r => r.json()).then(d => {
  if (d.github_token) {
    statusEl.textContent = "● github+";
    statusEl.style.color = "#22d3ee";
  } else {
    statusEl.textContent = "● online";
    statusEl.style.color = "#22d3ee";
  }
}).catch(() => {});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function hideWelcome() {
  if (welcome && welcome.parentNode) {
    welcome.style.opacity = "0";
    welcome.style.transition = "0.3s";
    setTimeout(() => welcome.remove(), 300);
  }
}

function addUser(text) {
  hideWelcome();
  const d = document.createElement("div");
  d.className = "msg user";
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function addBotLoading() {
  const d = document.createElement("div");
  d.className = "msg bot";
  d.innerHTML = '<div class="typing">ищу<span></span><span></span><span></span></div>';
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function fmt(n) {
  return n >= 1000 ? (n / 1000).toFixed(1) + "k" : n;
}

function renderBot(div, data) {
  if (data.error) {
    div.innerHTML = `<div class="answer" style="color:#f87171">❌ ${escapeHtml(data.error)}</div>`;
    return;
  }

  let html = "";
  let hasContent = false;

  // Репозитории
  if (data.repos && data.repos.length) {
    hasContent = true;
    html += `<div class="section-title">📦 Репозитории</div>`;
    data.repos.forEach(r => {
      html += `<div class="repo">`;
      html += `<div class="repo-head">`;
      html += `<div class="repo-name">${escapeHtml(r.name)}</div>`;
      html += `<div class="repo-stars">⭐ ${fmt(r.stars)}</div>`;
      html += `</div>`;
      if (r.language) {
        html += `<div class="repo-lang">${escapeHtml(r.language)}</div>`;
      }
      if (r.description) {
        html += `<div class="repo-desc">${escapeHtml(r.description)}</div>`;
      }
      if (r.topics && r.topics.length) {
        html += `<div class="repo-topics">${r.topics.map(t => "#" + escapeHtml(t)).join(" ")}</div>`;
      }
      html += `<a href="${escapeHtml(r.url)}" target="_blank" class="repo-link">${escapeHtml(r.url)}</a>`;
      html += `</div>`;
    });
  }

  // Код
  if (data.code && data.code.length) {
    hasContent = true;
    html += `<div class="section-title">💻 Код</div>`;
    data.code.forEach(c => {
      html += `<div class="code-block">`;
      html += `<div class="code-head">${escapeHtml(c.file)}</div>`;
      html += `<pre><code>${escapeHtml(c.content)}</code></pre>`;
      html += `</div>`;
    });
  }

  // Ответы
  if (data.answers && data.answers.length) {
    hasContent = true;
    if (data.repos && data.repos.length || data.code && data.code.length) {
      html += `<div class="section-title">📖 Что пишут</div>`;
    }
    data.answers.forEach(p => {
      html += `<div class="quote">${escapeHtml(p)}</div>`;
    });
  }

  if (!hasContent) {
    html += `<div class="answer">Ничего не нашёл 🤔</div>`;
  }

  if (data.from_cache) {
    html += `<div class="cache-tag">⚡ из кэша</div>`;
  }

  div.innerHTML = html;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;

  addUser(q);
  input.value = "";
  input.style.height = "auto";
  sendBtn.disabled = true;

  const botDiv = addBotLoading();

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: q })
    });
    const data = await r.json();
    renderBot(botDiv, data);
  } catch (err) {
    botDiv.innerHTML = `<div class="answer" style="color:#f87171">❌ ${escapeHtml(err.message)}</div>`;
  } finally {
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

clearBtn.addEventListener("click", () => location.reload());

document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => {
    input.value = c.dataset.q;
    form.requestSubmit();
  });
});
</script>
</body>
  </html>
